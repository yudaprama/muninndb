[package]
name = "muninn"
version = "0.1.0"
edition = "2021"
description = "Rust client for MuninnDB — cognitive memory engine for AI agents"
license = "BSL-1.1"
readme = "README.md"
keywords = ["munnindb", "memory", "ai", "cognitive", "rag"]
categories = ["database", "web-programming"]

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "io-util", "time"] }
tokio-util = "0.7"
tokio-stream = "0.1"
thiserror = "2"
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
